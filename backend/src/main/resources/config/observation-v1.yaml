# Parametri versionati del conto Demo. Nessuna credenziale e nessun indirizzo di rete.
# Scala: minor unit della valuta (EUR, 2 decimali: 500.00 = 50000); bps = 1/100 di punto percentuale;
# millis = millesimi di 1 (1000 = 1.00). Le soglie tecniche sono calibrabili.
schema: trading-parameters/1
author: daniele
reason: "Budget 500 EUR. Perdita massima 10% del budget, poi blocco. Orizzonte in giorni. Universo solo Bitcoin, solo long, leva 1. Benchmark MSCI World total return. Ingresso e uscita closed-bar-trend/1 sui prezzi eToro, solo barre da 5 minuti già chiuse: ingresso dopo 2 chiusure consecutive al rialzo, uscita dopo 2 chiusure al ribasso oppure stop a 2×ATR oppure 390 barre. Size = minimo tra rischio 0,50% del budget, cap 15% per strumento e budget residuo dopo il 20% di cassa. Capability e licenze non verificate. La cassa mostrata è quella nativa eToro, senza conversione."
economic:
  base_currency: EUR
  currency_scale: 2
  assigned_budget_amount: "500.00"
  assigned_budget_minor: 50000
  max_loss_bps: 1000
  max_loss_action: block
  horizon: days
  allowlist:
    universe: bitcoin
    direction: long_only
    leverage: 1
    instrument_ids: []
    # Solo Bitcoin. Un future, un ETF o un altro simbolo non entra.
    entry_symbols:
      - BTC
  benchmark:
    name: MSCI World
    return_basis: total_return
  # 100 EUR, il 20% del budget, restano non investiti.
  cash_buffer_minor: 10000
  max_positions: 8
  max_drawdown_bps: null
  # 0,50% di 500 EUR = 2,50 EUR di rischio per nuovo ingresso.
  risk_per_trade_bps: 50
  # 2% del budget = 10 EUR di rischio aperto complessivo.
  aggregate_risk_bps: 200
  # 15% del budget = 75 EUR per strumento.
  instrument_exposure_bps: 1500
  # 30% del budget = 150 EUR per settore.
  sector_exposure_bps: 3000
  # 20% del budget resta cassa.
  min_cash_bps: 2000
  # Il riferimento BCE non modifica la cassa mostrata.
  fx_haircut_bps: 100
  # Una barra da 5 minuti prima di un nuovo ingresso.
  cooldown_seconds: 300
  # 390 barre chiuse da 5 minuti: cinque sessioni da 6,5 ore.
  max_holding_count: 390
technical:
  calibratable: true
  tie_break: instrument_id
  price_poll_seconds: 60
  decision_bar_seconds: 300
  order_poll_min_seconds: 15
  order_poll_max_seconds: 30
  news_poll_seconds: 300
  macro_check_seconds: 3600
  slow_data_refresh_seconds: 86400
  prices_stale_seconds: 120
  orders_stale_seconds: 45
