# Parametri versionati del conto Demo. Nessuna credenziale e nessun indirizzo di rete.
# Scala: minor unit della valuta (EUR, 2 decimali: 500.00 = 50000); bps = 1/100 di punto percentuale;
# millis = millesimi di 1 (1000 = 1.00). Le soglie tecniche sono calibrabili.
schema: trading-parameters/1
author: daniele
reason: "Budget 500 EUR. Perdita massima 10% del budget, poi blocco. Orizzonte in giorni. Allowlist large-cap e ETF, solo long, leva 1. Benchmark MSCI World total return. Capability e licenze non verificate. Cambio EUR/USD dal riferimento giornaliero BCE, haircut 100 bps."
economic:
  base_currency: EUR
  currency_scale: 2
  assigned_budget_amount: "500.00"
  assigned_budget_minor: 50000
  max_loss_bps: 1000
  max_loss_action: block
  horizon: days
  allowlist:
    universe: large_cap_stocks_and_etfs
    direction: long_only
    leverage: 1
    instrument_ids: []
  benchmark:
    name: MSCI World
    return_basis: total_return
  cash_buffer_minor: null
  max_positions: null
  max_drawdown_bps: null
  risk_per_trade_bps: null
  aggregate_risk_bps: null
  instrument_exposure_bps: null
  sector_exposure_bps: null
  min_cash_bps: null
  # 100 bps: il riferimento BCE non è un prezzo eseguibile. La cassa USD convertita è ridotta dell'1% prima del disponibile.
  fx_haircut_bps: 100
  cooldown_seconds: null
  max_holding_count: null
