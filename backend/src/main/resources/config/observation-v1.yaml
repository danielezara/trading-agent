  slow_data_stale_seconds: 7200
  price_conflict_bps: 10
  price_conflict_spread_multiple: 3
  price_conflict_align_seconds: 30
  volume_conflict_bps: 3000
  quality_schema_millis: 400
  quality_provenance_millis: 350
  quality_freshness_millis: 250
  quality_threshold_millis: 850
  probabilistic_schema_millis: 250
  probabilistic_provenance_millis: 200
  probabilistic_freshness_millis: 150
  probabilistic_calibration_millis: 400
  event_quality_threshold_millis: 650
  weight_quant_millis: 450
  weight_macro_millis: 150
  weight_news_millis: 150
  weight_fundamental_millis: 150
  weight_liquidity_millis: 100
  weight_trend_millis: 600
  weight_momentum_millis: 250
  weight_reversion_millis: 150
  buy_score_millis: 650
  buy_confidence_millis: 650
  exit_score_millis: 350
  confirmation_bars: 2
  stability_scale_millis: 250
  confidence_agreement_floor_millis: 500
  confidence_agreement_slope_millis: 500
  stop_atr_multiple_millis: 2000
  chase_bps: 25
  event_blackout_minutes: 30
  event_key_floor_minutes: 30
  edge_shrinkage_millis: 500
  edge_min_observations: 100
  edge_min_bps: 75
  edge_to_stop_millis: 250
  cost_share_of_gross_edge_millis: 500
  edge_buffer_bps: 25
  stressed_cost_multiple_millis: 1500
  slippage_spread_divisor: 2
  slippage_percentile: 95
  slippage_atr_coefficient_millis: 100
  regime_ema_fast_bars: 20
  regime_ema_slow_bars: 60
  regime_ema_bars: 200
  regime_vol_bars: 20
  regime_atr_bars: 20
  regime_vol_percentile_favorable: 75
  regime_vol_percentile_stress: 90
  regime_lateral_atr_ratio_millis: 1000
  regime_size_trend_millis: 1000
  regime_size_lateral_millis: 750
  regime_size_high_vol_millis: 500
  regime_buy_score_lateral_millis: 700
  regime_buy_score_high_vol_millis: 750
  regime_stress_benchmark_drawdown_bps: 1000
  ece_bins: 10
  ece_max_observations: 2000
  ece_min_observations: 500
