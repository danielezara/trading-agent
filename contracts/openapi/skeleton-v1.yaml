openapi: 3.0.3
info:
  title: Trading agent skeleton API
  version: 0.1.0
  description: >
    Read-only surface of the OBSERVATION skeleton. There is no broker client,
    no order placement, and no path to ACTIVE. Any method other than GET or HEAD
    returns 403 OBSERVATION_MUTATIONS_DISABLED.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health/live:
    get:
      operationId: live
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP]
  /health/ready-trading:
    get:
      operationId: readyTrading
      responses:
        "503":
          description: Trading workers are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownProbe"
  /health/ready-admin:
    get:
      operationId: readyAdmin
      responses:
        "503":
          description: Admin readiness is down because the datastore is not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownProbe"
  /api/v1/system/status:
    get:
      operationId: systemStatus
      responses:
        "200":
          description: Observation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusEnvelope"
  /api/v1/configurations:
    get:
      operationId: listConfigurations
      responses:
        "200":
          description: Immutable configuration versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationListEnvelope"
  /api/v1/configurations/active:
    get:
      operationId: activeConfiguration
      responses:
        "200":
          description: Active configuration version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationEnvelope"
  /api/v1/operational-state:
    get:
      operationId: operationalState
      responses:
        "200":
          description: Current operational state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalStateEnvelope"
  /api/v1/data-health:
    get:
      operationId: dataHealth
      responses:
        "200":
          description: Classpath fixture channel health, with no network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataHealthEnvelope"
  /api/v1/decisions/latest:
    get:
      operationId: latestDecision
      responses:
        "200":
          description: Deterministic NO-TRADE decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEnvelope"
  /api/v1/audit:
    get:
      operationId: auditChain
      responses:
        "200":
          description: In-memory tamper-evident decision audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEnvelope"
  /api/v1/evidence-gate:
    get:
      operationId: evidenceGate
      responses:
        "200":
          description: Evidence rows, all unverified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelope"
  /api/dashboard/v1/session:
    get:
      operationId: dashboardSession
      responses:
        "200":
          description: Unauthenticated local session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
  /api/dashboard/v1/overview:
    get:
      operationId: dashboardOverview
      responses:
        "200":
          description: Empty portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewEnvelope"
components:
  schemas:
    ConfigurationEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          $ref: "#/components/schemas/Configuration"
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    ConfigurationListEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Configuration"
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    Configuration:
      type: object
      required: [version_id, version_number, author, reason, content_sha256, active, budget]
      properties:
        version_id:
          type: string
        version_number:
          type: integer
        author:
          type: string
        created_at:
          type: string
          format: date-time
        reason:
          type: string
        content_sha256:
          type: string
        valid_from_bar_open:
          type: string
          format: date-time
        active:
          type: boolean
        budget:
          type: object
          properties:
            base_currency:
              type: string
              nullable: true
            assigned_budget_minor:
              type: integer
              nullable: true
            cash_buffer_minor:
              type: integer
              nullable: true
            max_positions:
              type: integer
              nullable: true
        economic:
          type: object
          properties:
            max_loss_bps:
              type: integer
              nullable: true
            max_loss_action:
              type: string
              nullable: true
            horizon:
              type: string
              nullable: true
            allowlist_universe:
              type: string
              nullable: true
            allowlist_direction:
              type: string
              nullable: true
            leverage:
              type: integer
              nullable: true
            benchmark_name:
              type: string
              nullable: true
            benchmark_return_basis:
              type: string
              nullable: true
            technical_calibratable:
              type: boolean
            source_path:
              type: string
    OperationalStateEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [state, actions]
          properties:
            state:
              type: string
              enum: [OBSERVATION]
            since:
              type: string
              format: date-time
            reason:
              type: string
            generation:
              type: integer
            actions:
              type: object
              properties:
                new_entries:
                  type: boolean
                  enum: [false]
                local_exits:
                  type: boolean
                  enum: [false]
                cancel:
                  type: boolean
                  enum: [false]
                reconcile_permitted:
                  type: boolean
                reconcile_wired:
                  type: boolean
                  enum: [false]
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    DownProbe:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [DOWN]
        operational_state:
          type: string
        reason:
          type: string
    Meta:
      type: object
      required: [api_version, schema_version, environment, consistency, freshness]
      properties:
        api_version:
          type: string
        schema_version:
          type: string
        request_id:
          type: string
        generated_at:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        environment:
          type: string
          enum: [DEMO]
        base_currency:
          type: string
          nullable: true
        consistency:
          type: string
        as_of:
          type: string
          nullable: true
        reconciled_at:
          type: string
          nullable: true
        freshness:
          type: object
          properties:
            status:
              type: string
            age_ms:
              type: integer
              nullable: true
            stale_after_ms:
              type: integer
              nullable: true
    Warning:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
        detail:
          type: string
    SystemStatusEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [operational_state, trading_enabled, broker_dispatch, active_transition_allowed, strategy_action]
          properties:
            operational_state:
              type: string
              enum: [OBSERVATION]
            environment:
              type: string
              enum: [DEMO]
            trading_enabled:
              type: boolean
              enum: [false]
            broker_dispatch:
              type: string
              enum: [disabled]
            broker_connected:
              type: boolean
            last_probe_at:
              type: string
              format: date-time
              nullable: true
            probe_error_class:
              type: string
              nullable: true
            active_transition_allowed:
              type: boolean
              enum: [false]
            strategy_action:
              type: string
              enum: [NO-TRADE]
            strategy_reason:
              type: string
            ingestion_enabled:
              type: boolean
              enum: [false]
            ingestion_source:
              type: string
              enum: [classpath-fixture]
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    EvidenceEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [allows_active, rows]
          properties:
            allows_active:
              type: boolean
              enum: [false]
            broker_connected:
              type: boolean
            last_probe_at:
              type: string
              format: date-time
              nullable: true
            probe_error_class:
              type: string
              nullable: true
            rows:
              type: array
              items:
                type: object
                required: [control_id, status]
                properties:
                  control_id:
                    type: string
                  scope:
                    type: string
                  owner_role:
                    type: string
                  status:
                    type: string
                    enum: [UNVERIFIED, PASS, FAIL, EXPIRED]
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    SessionEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [authenticated, capabilities]
          properties:
            authenticated:
              type: boolean
            role:
              type: string
              nullable: true
            environment:
              type: string
              enum: [DEMO]
            capabilities:
              type: object
              properties:
                view:
                  type: boolean
                acknowledge_alert:
                  type: boolean
                kill_switch:
                  type: boolean
                reset:
                  type: boolean
                configure:
                  type: boolean
                place_order:
                  type: boolean
                  enum: [false]
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    OverviewEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [operational_state, trading_enabled]
          properties:
            operational_state:
              type: string
              enum: [OBSERVATION]
            trading_enabled:
              type: boolean
              enum: [false]
            equity:
              nullable: true
            broker_cash:
              nullable: true
            assigned_budget:
              nullable: true
            available_cash:
              nullable: true
            reserved_cash:
              nullable: true
            position_count:
              type: integer
              nullable: true
            unknown_order_count:
              type: integer
              nullable: true
            ledger_status:
              type: string
            journal_entry_count:
              type: integer
            journal_balanced:
              type: boolean
            broker_connected:
              type: boolean
            last_probe_at:
              type: string
              format: date-time
              nullable: true
            probe_error_class:
              type: string
              nullable: true
            account_label:
              type: string
              nullable: true
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    Problem:
      type: object
      required: [status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [OBSERVATION_MUTATIONS_DISABLED]
        retryable:
          type: boolean
    DataHealthEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [source, network, channels]
          properties:
            source:
              type: string
              enum: [classpath-fixture]
            network:
              type: boolean
              enum: [false]
            connector_version:
              type: string
            quarantined_count:
              type: integer
            channels:
              type: array
              items:
                type: object
                required: [channel, status, quality_millis, accepted_count]
                properties:
                  channel:
                    type: string
                  source:
                    type: string
                  status:
                    type: string
                  quality_millis:
                    type: integer
                  accepted_count:
                    type: integer
                  stale:
                    type: boolean
                  conflict:
                    type: boolean
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    DecisionEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [action, reason_codes, input_hash]
          properties:
            action:
              type: string
              enum: [NO-TRADE]
            reason_codes:
              type: array
              items:
                type: string
            summary:
              type: string
            input_hash:
              type: string
            evaluated_at:
              type: string
              format: date-time
            config_version_id:
              type: string
            audit_event_hash:
              type: string
            policy:
              type: object
              required: [accepted, reason, broker_called]
              properties:
                accepted:
                  type: boolean
                  enum: [false]
                reason:
                  type: string
                broker_called:
                  type: boolean
                  enum: [false]
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    AuditEnvelope:
      type: object
      required: [data, meta, warnings]
      properties:
        data:
          type: object
          required: [durable, chain_valid, event_count]
          properties:
            durable:
              type: boolean
              enum: [false]
            chain_valid:
              type: boolean
            event_count:
              type: integer
            head_hash:
              type: string
              nullable: true
            daily_digest:
              type: string
              nullable: true
            daily_digest_sealed:
              type: boolean
        meta:
          $ref: "#/components/schemas/Meta"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
